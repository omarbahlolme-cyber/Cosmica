name: Live Security Check

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  live-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production security checks
        run: npm run security:live
