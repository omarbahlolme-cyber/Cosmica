name: Weekly Backup

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create backup snapshot
        run: npm run backup:create

      - name: Verify backup snapshot
        run: npm run backup:verify

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmica-backup-${{ github.run_number }}
          path: backups/*
          retention-days: 90

      - name: Optional offsite mirror push
        if: ${{ secrets.BACKUP_REPO != '' && secrets.BACKUP_PAT != '' }}
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add offsite "https://x-access-token:${BACKUP_PAT}@github.com/${BACKUP_REPO}.git"
          git push --mirror offsite
