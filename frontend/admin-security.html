<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Cosmica Admin Security</title>
    <style>
      :root {
        --bg: #060d22;
        --panel: #0d1a3d;
        --panel-2: #11224c;
        --line: rgba(141, 214, 255, 0.28);
        --text: #eaf4ff;
        --muted: #b7cde8;
        --ok: #8ff1c1;
        --warn: #ffb2ba;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at 15% -10%, #17366e 0%, transparent 45%), var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        margin: 24px auto;
        padding: 0 14px 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }
      .note {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .card {
        background: linear-gradient(160deg, var(--panel), var(--panel-2));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .row-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(142, 206, 241, 0.4);
        border-radius: 8px;
        background: rgba(7, 16, 35, 0.9);
        color: var(--text);
        padding: 8px 9px;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        border: 1px solid rgba(149, 231, 199, 0.54);
        border-radius: 9px;
        background: linear-gradient(135deg, #0f5f52, #14826d);
        color: #effff8;
        font-weight: 700;
        padding: 8px 10px;
        cursor: pointer;
      }
      button.secondary {
        border-color: rgba(145, 209, 245, 0.52);
        background: linear-gradient(145deg, #13335a, #132b4d);
      }
      button.danger {
        border-color: rgba(255, 158, 168, 0.56);
        background: linear-gradient(145deg, #6a1d2a, #4e1922);
      }
      .status {
        min-height: 18px;
        margin: 6px 0 0;
        font-size: 0.83rem;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--warn);
      }
      pre {
        margin: 0;
        border: 1px solid rgba(136, 203, 239, 0.24);
        border-radius: 10px;
        background: rgba(8, 16, 35, 0.9);
        padding: 10px;
        overflow: auto;
        max-height: 420px;
        font-size: 0.78rem;
        line-height: 1.4;
      }
      @media (max-width: 820px) {
        .row,
        .row-3 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Admin Security Console</h1>
      <p class="note">
        Local/admin use only. Protected by browser Basic Auth and requires backend
        <code>ADMIN_SECURITY_TOKEN</code>.
      </p>

      <section class="card">
        <div class="row">
          <label>
            Admin token
            <input id="adminToken" type="password" autocomplete="off" placeholder="Paste ADMIN_SECURITY_TOKEN" />
          </label>
          <label>
            Event limit
            <input id="eventsLimit" type="number" min="1" max="5000" value="200" />
          </label>
        </div>
        <div class="actions">
          <button id="loadBlockedBtn" class="secondary" type="button">Load blocked list</button>
          <button id="loadEventsBtn" class="secondary" type="button">Load events</button>
        </div>
      </section>

      <section class="card">
        <h2 style="margin: 0 0 8px; font-size: 1rem">Block user</h2>
        <div class="row-3">
          <label>Email <input id="blockEmail" type="text" placeholder="user@example.com" /></label>
          <label>User ID <input id="blockUserId" type="text" placeholder="uuid" /></label>
          <label>IP (optional) <input id="blockIp" type="text" placeholder="1.2.3.4" /></label>
        </div>
        <div class="row">
          <label>Reason <input id="blockReason" type="text" value="policy-violation" /></label>
          <label>Blocked by <input id="blockBy" type="text" value="owner" /></label>
        </div>
        <label>Note <input id="blockNote" type="text" placeholder="Optional admin note" /></label>
        <div class="actions">
          <button id="blockBtn" class="danger" type="button">Block</button>
        </div>
      </section>

      <section class="card">
        <h2 style="margin: 0 0 8px; font-size: 1rem">Unblock user</h2>
        <div class="row-3">
          <label>Email <input id="unblockEmail" type="text" placeholder="user@example.com" /></label>
          <label>User ID <input id="unblockUserId" type="text" placeholder="uuid" /></label>
          <label>IP (optional) <input id="unblockIp" type="text" placeholder="1.2.3.4" /></label>
        </div>
        <div class="actions">
          <button id="unblockBtn" type="button">Unblock</button>
        </div>
      </section>

      <section class="card">
        <h2 style="margin: 0 0 8px; font-size: 1rem">Response</h2>
        <p id="status" class="status"></p>
        <pre id="output">No data loaded yet.</pre>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusNode = $("status");
      const outputNode = $("output");

      const setStatus = (text, tone = "") => {
        statusNode.textContent = String(text || "");
        statusNode.className = `status ${tone}`.trim();
      };

      const getToken = () => String($("adminToken").value || "").trim();

      const requestAdmin = async (url, options = {}) => {
        const token = getToken();
        if (!token) {
          throw new Error("Enter admin token first.");
        }
        const headers = {
          Accept: "application/json",
          "x-admin-token": token,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
        };
        const response = await fetch(url, {
          method: options.method || "GET",
          credentials: "include",
          cache: "no-store",
          headers,
          ...(options.body ? { body: JSON.stringify(options.body) } : {}),
        });
        let payload = null;
        try {
          payload = await response.json();
        } catch {
          payload = null;
        }
        if (!response.ok) {
          throw new Error(String(payload?.error || `Request failed (${response.status})`));
        }
        return payload || {};
      };

      const showPayload = (payload) => {
        outputNode.textContent = JSON.stringify(payload, null, 2);
      };

      $("loadBlockedBtn").addEventListener("click", async () => {
        setStatus("Loading blocked list...");
        try {
          const payload = await requestAdmin("/api/admin/security/blocked");
          showPayload(payload);
          setStatus("Blocked list loaded.", "ok");
        } catch (error) {
          setStatus(error.message, "err");
        }
      });

      $("loadEventsBtn").addEventListener("click", async () => {
        setStatus("Loading events...");
        try {
          const limit = Math.max(1, Math.min(5000, Number($("eventsLimit").value) || 200));
          const payload = await requestAdmin(`/api/admin/security/events?limit=${encodeURIComponent(limit)}`);
          showPayload(payload);
          setStatus("Events loaded.", "ok");
        } catch (error) {
          setStatus(error.message, "err");
        }
      });

      $("blockBtn").addEventListener("click", async () => {
        setStatus("Blocking...");
        try {
          const payload = await requestAdmin("/api/admin/security/block", {
            method: "POST",
            body: {
              email: $("blockEmail").value,
              userId: $("blockUserId").value,
              ip: $("blockIp").value,
              reason: $("blockReason").value,
              note: $("blockNote").value,
              blockedBy: $("blockBy").value,
            },
          });
          showPayload(payload);
          setStatus("User blocked.", "ok");
        } catch (error) {
          setStatus(error.message, "err");
        }
      });

      $("unblockBtn").addEventListener("click", async () => {
        setStatus("Unblocking...");
        try {
          const payload = await requestAdmin("/api/admin/security/unblock", {
            method: "POST",
            body: {
              email: $("unblockEmail").value,
              userId: $("unblockUserId").value,
              ip: $("unblockIp").value,
            },
          });
          showPayload(payload);
          setStatus(payload.changed ? "User unblocked." : "No matching block entry.", "ok");
        } catch (error) {
          setStatus(error.message, "err");
        }
      });
    </script>
  </body>
</html>
